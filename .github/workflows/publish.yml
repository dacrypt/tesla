name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release (tag, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/tesla_cli/__init__.py)
          echo "tag=$tag pyproject=$py __init__=$init"
          test "$tag" = "$py"
          test "$tag" = "$init"
          grep -q "^## \[$tag\]" CHANGELOG.md
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra serve --extra fleet --extra teslaMate --extra pdf --extra query
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pytest -m "not integration" -q
        env:
          NO_COLOR: "1"

  build-and-publish:
    name: Build and publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tesla-cli
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (no API token needed)

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Block publication of sensitive data
        run: scripts/secret-scan.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Scan distribution archives before publication
        run: scripts/secret-scan.sh --artifacts dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
