services:
  tesla-cli:
    # Prebuilt multi-arch image (amd64 + arm64: Raspberry Pi, most NAS).
    # Pin a release with TESLA_CLI_TAG=5.4.0; `docker compose build` builds locally.
    image: ghcr.io/dacrypt/tesla-cli:${TESLA_CLI_TAG:-latest}
    build: .
    container_name: tesla-cli
    ports:
      # Reachable from your LAN. The API key is auto-generated on first start
      # (see `docker compose logs tesla-cli`, or run
      # `docker compose exec tesla-cli tesla serve api-key`).
      # Set TESLA_BIND=127.0.0.1 to keep it local to this host only.
      - "${TESLA_BIND:-0.0.0.0}:${TESLA_PORT:-8080}:8080"
    volumes:
      - tesla-config:/home/tesla/.tesla-cli
    environment:
      - TESLA_VIN=${TESLA_VIN:-}
      - TESLA_RN=${TESLA_RN:-}
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8080/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tesla-config:
